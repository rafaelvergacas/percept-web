<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Percep2</title>
<script src="../assets/stores.js"></script>
<script>
(function(){
  var src=(location.search.match(/[?&]src=([^&#]*)/)||[])[1];
  try{src=src&&decodeURIComponent(src.replace(/\+/g,' '));}catch(e){}
  var ref='utm_source=qr'+(src?'&utm_campaign='+encodeURIComponent(src):'');
  window.GET_REFERRER=ref;
  var url=window.storeUrl&&storeUrl(null,ref);
  if(!url){
    var s=null;try{s=localStorage.getItem('lang');}catch(e){}
    var l=(navigator.languages&&navigator.languages[0])||navigator.language||'';
    url=(s==='pt-br'||(s===null&&/^pt/i.test(l)))?'/pt-br/#get':'/#get';
  }
  document.documentElement.className='go';
  setTimeout(function(){document.documentElement.className='';},1500);
  location.replace(url);
})();
</script>
<link rel="stylesheet" href="../assets/site.css">

main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:3rem 0}

.stores{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.stores .btn{min-width:190px;gap:.6rem;background:var(--blue);color:#fff}
.stores .btn:hover{background:var(--blue-d)}
.site{margin-top:2rem;font-size:var(--fs-s);color:var(--slate)}
.site a{color:var(--blue-l);margin:0 .4rem}
@media(max-width:640px){.stores .btn{width:100%;max-width:320px}}
</style>
</head>
<body>

</html>
